<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one centered column. Header with language + music, a 16:9 pixel stage, a dialogue box below.
   Deliberately single-theme: a twilight arcade look, so every color is set explicitly. */
:root{
  --night:#1c1433;
  --night2:#2a1f4a;
  --line:#4b3b7a;
  --paper:#fff3e6;
  --rose:#ff6f91;
  --rose-d:#c9456b;
  --gold:#ffc857;
  --sky:#6fa0ff;
  --soft:#cfc3ee;
  --font-title:'Press Start 2P','Courier New',monospace;
  --font-body:'Pixelify Sans','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--night);color:var(--paper);
  font-family:var(--font-body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;
}
.game{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--font-title);font-size:12px;color:var(--rose);letter-spacing:.04em}
.brand b{color:var(--paper);font-weight:400}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  font-family:var(--font-title);font-size:10px;line-height:1;
  background:var(--night2);color:var(--paper);border:3px solid var(--line);
  padding:9px 10px;cursor:pointer;border-radius:0;
}
.pill[aria-pressed="true"]{background:var(--rose);border-color:var(--paper);color:var(--night)}
.pill:focus-visible,.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage-wrap{
  position:relative;aspect-ratio:16/9;width:100%;
  border:4px solid var(--paper);background:#000;
  box-shadow:0 0 0 4px var(--night2),8px 8px 0 4px rgba(0,0,0,.55);
  cursor:pointer;
}
canvas.stage{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.chip{
  position:absolute;left:8px;top:8px;max-width:calc(100% - 130px);
  font-family:var(--font-title);font-size:9px;line-height:1.5;
  background:rgba(28,20,51,.85);color:var(--paper);padding:6px 8px;border:2px solid var(--paper);
}
.hud{
  position:absolute;right:8px;top:8px;display:flex;gap:3px;
  background:rgba(28,20,51,.85);padding:5px 6px;border:2px solid var(--paper);
}
.hud canvas{width:17px;height:15px;image-rendering:pixelated}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:12px;
  background:linear-gradient(rgba(28,20,51,.55),rgba(28,20,51,.8));
}
.big{
  font-family:var(--font-title);font-size:clamp(14px,4.6vw,32px);line-height:1.5;
  color:var(--paper);text-shadow:3px 3px 0 var(--rose-d);text-wrap:balance;
}
.big canvas{width:1.1em;height:.95em;image-rendering:pixelated;vertical-align:baseline;margin:0 .15em}
.tag{margin:0;font-size:clamp(14px,2.8vw,20px);max-width:34ch;text-wrap:balance}
.btn{
  font-family:var(--font-title);font-size:12px;background:var(--rose);color:var(--night);
  border:3px solid var(--paper);padding:12px 18px;cursor:pointer;border-radius:0;
  box-shadow:4px 4px 0 var(--rose-d);
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--rose-d)}

.dialog{
  position:relative;background:var(--night2);border:4px solid var(--paper);
  box-shadow:8px 8px 0 rgba(0,0,0,.55);
  padding:24px 18px 18px;min-height:168px;cursor:pointer;
  display:flex;flex-direction:column;gap:12px;
}
.who{
  position:absolute;top:-17px;left:12px;font-family:var(--font-title);font-size:10px;
  padding:7px 10px;border:3px solid var(--paper);color:var(--night);
}
.who.az{background:var(--sky)}
.who.ke{background:var(--rose)}
.txt{margin:0;font-size:clamp(18px,3.4vw,22px);min-height:3.9em;max-width:62ch;text-wrap:pretty}
.txt.narr{color:var(--soft)}
.next{
  position:absolute;right:16px;bottom:14px;width:0;height:0;
  border-left:11px solid var(--gold);border-top:8px solid transparent;border-bottom:8px solid transparent;
  animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}
.choices{display:grid;gap:10px}
.choice{
  font-family:var(--font-body);font-size:clamp(17px,3.2vw,21px);line-height:1.3;text-align:left;
  background:var(--night);color:var(--paper);border:3px solid var(--rose);
  padding:11px 13px;cursor:pointer;border-radius:0;
}
.choice:hover{background:var(--rose);color:var(--night)}
.hint{margin:0;font-size:14px;color:var(--soft);text-align:center}
@media (prefers-reduced-motion:reduce){.next{animation:none}}
</style>

</main>

function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function disk(x0,y0,r,c){cx.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));cx.fillRect(Math.round(x0-w),Math.round(y0+y),w*2+1,1);}}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*t);}).join(',')+')';}
function vgrad(y0,y1,stops,band){
  band=band||3;
  for(let y=y0;y<y1;y+=band){
    const t=(y-y0)/Math.max(1,(y1-y0));
    let i=0;while(i<stops.length-2&&t>stops[i+1][0])i++;
    const a=stops[i],b=stops[i+1];
    const u=Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0])));
    R(0,y,W,Math.min(band,y1-y),mix(a[1],b[1],u));
  }
}
function spr(map,pal,x,y){
  for(let j=0;j<map.length;j++){const row=map[j];
    for(let i=0;i<row.length;i++){const ch=row[i];if(ch!=='.')R(x+i,y+j,1,1,pal[ch]);}}
}
const HM=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function heart(x,y,c){
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(HM[j][i]==='X')R(x+i,y+j,1,1,c);
  R(x+1,y+1,1,1,'#ffffff');
}

function drawCast(g,t,wed){
  const y0=g-20,blink=(t%3.4)<0.13;
  const azMove=Math.abs(st.azx-st.azt)>0.8,keMove=Math.abs(st.kex-st.ket)>0.8;
  const ax=Math.round(st.azx),kx=Math.round(st.kex);
  R(ax+1,g,10,1,'rgba(0,0,0,0.28)');
  R(kx+1,g,10,1,'rgba(0,0,0,0.28)');
  // AZZY
  const aTalk=(st.speaker==='AZZY'&&st.typing)?(Math.floor(t*9)%2):0;
  const aBob=azMove?(Math.floor(t*10)%2):0;
  const apal=wed?(blink?PAWb:PAW):(blink?PAb:PA);
  const amap=wed?AZW:AZ;
  if(st.kneel){
    spr(amap.slice(0,14),apal,ax,y0+4);
    R(ax+2,y0+18,9,2,apal.P);
    R(ax,y0+18,3,2,apal.B);
    R(ax+11,y0+10,4,1,SKIN);
    R(ax+14,y0+8,5,4,'#2a1530');
    R(ax+15,y0+9,3,2,'#ffd23f');
    if(Math.floor(t*3)%2)R(ax+16,y0+5,1,3,'#ffffff');
  }else{
    spr(amap,apal,ax,y0-aTalk-aBob);
  }
  // KEIII
  const kTalk=(st.speaker==='KEIII'&&st.typing)?(Math.floor(t*9)%2):0;
  const kBob=keMove?(Math.floor(t*10)%2):0;
  spr(wed?KEW:KE,wed?(blink?PKWb:PKW):(blink?PKb:PK),kx,y0-kTalk-kBob);
  // held hands
  const lo=Math.min(ax,kx),hi=Math.max(ax,kx);
  if(!st.kneel&&hi-lo<=12&&hi-lo>0&&!azMove&&!keMove)R(lo+11,y0+11,hi+1-(lo+11),1,SKIN);
}

  for(let y=64;y<H;y++){const w=6+(y-64)*0.85;R(96-w-1,y,2*w+2,1,'#ffd56b');R(96-w,y,2*w,1,'#d94a6b');}
  const cheer=st.fx==='hearts';
  [10,22,34,46,58].forEach(function(x,i){guest(x,60,i,t,cheer);});
  [128,140,152,164,176].forEach(function(x,i){guest(x,60,i+5,t,cheer);});
  [16,28,40,52,64].forEach(function(x,i){guest(x,72,i+2,t,cheer);});
  [122,134,146,158,170].forEach(function(x,i){guest(x,72,i+8,t,cheer);});
  // arch
  R(70,34,4,48,'#fff3e6');R(118,34,4,48,'#fff3e6');
  for(let x=70;x<=122;x++){
    const y=22+Math.round(12*(1-Math.sqrt(Math.max(0,1-Math.pow((x-96)/26,2)))));
    R(x,y,1,4,'#fff3e6');
  }
  const fc=['#ff9fc0','#ffffff','#e0b0ff','#ff6f91'];
  for(let x=68;x<=124;x+=3){
    const y=20+Math.round(12*(1-Math.sqrt(Math.max(0,1-Math.pow((x-96)/26,2)))));
    R(x,y-1+rnd(x)*3,3,3,fc[(x/3|0)%4]);
    R(x+1,y+3+rnd(x+3)*4,2,2,'#4fae6a');
  }
  for(let y=36;y<80;y+=5){R(69,y,2,2,fc[(y/5|0)%4]);R(121,y+2,2,2,fc[(y/5+1|0)%4]);R(73,y+1,2,2,'#4fae6a');R(117,y+1,2,2,'#4fae6a');}
}
function fgWedding(t){
  for(let i=0;i<50;i++){
    const py=(t*(8+rnd(i)*8)+rnd(i+30)*H)%H;
    const px=(((rnd(i)*W+Math.sin(t*1.1+i)*8+t*5)%W)+W)%W;
    R(px,py,rnd(i+9)>0.5?2:1,1,i%3===0?'#ffffff':'#ffc2d6');
  }
}

const SC={
  street:{g:88,bg:bgStreet,fg:fgStreet,wed:false},
  park:{g:92,bg:bgPark,fg:fgPark,wed:false},
  roof:{g:98,bg:bgRoof,fg:fgRoof,wed:false},
  beach:{g:100,bg:bgBeach,fg:function(){},wed:false},
  lantern:{g:76,bg:bgLantern,fg:function(){},wed:false},
  wedding:{g:94,bg:bgWedding,fg:fgWedding,wed:true}
};

/* ---------- game flow ---------- */
const $=function(id){return document.getElementById(id);};
const els={chip:$('chip'),hud:$('hud'),title:$('title'),endcard:$('endcard'),who:$('who'),txt:$('txt'),choices:$('choices'),next:$('next'),
  hint:$('hint'),tagline:$('tagline'),start:$('start'),again:$('again'),endTitle:$('endTitle'),endSub:$('endSub'),mus:$('mus'),dlg:$('dlg'),wrap:$('wrap'),th:$('th')};
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let lang='en';
try{const s=localStorage.getItem('azzy-keiii-lang');if(s&&UI[s])lang=s;}catch(e){}

let Q=[],qi=0,hearts=0,playing=false,awaiting=false,chap=0;
let full='',shown=0,typeStart=0,curBeat=null;

function setScene(name,from){
  sceneName=name;
  st.azx=st.azt=from.az;st.kex=st.ket=from.ke;st.kneel=false;st.fx=null;
}
function applyCast(c){
  if('az' in c)st.azt=c.az;
  if('ke' in c)st.ket=c.ke;
  if('kneel' in c)st.kneel=c.kneel;
  if('fx' in c)st.fx=c.fx;
}
function drawHeartCanvas(c,on){
  const g=c.getContext('2d');
  g.clearRect(0,0,7,6);
  g.fillStyle=on?'#ff6f91':'#4b3b7a';
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(HM[j][i]==='X')g.fillRect(i,j,1,1);
}
function drawHud(){
  els.hud.innerHTML='';
  for(let i=0;i<5;i++){
    const c=document.createElement('canvas');c.width=7;c.height=6;
    drawHeartCanvas(c,i<hearts);
    els.hud.appendChild(c);
  }
}
function updChip(){
  els.chip.textContent=UI[lang].chapter+' '+(chap+1)+' · '+UI[lang].ch[chap];
}
function setWho(name){
  if(!name){els.who.hidden=true;return;}
  els.who.hidden=false;
  els.who.textContent=name;
  els.who.className='who '+(name==='AZZY'?'az':'ke');
}
function startType(text,narr){
  full=text;shown=0;typeStart=performance.now();st.typing=true;
  els.txt.className='txt'+(narr?' narr':'');
  els.txt.textContent='';
}
function finishType(){
  st.typing=false;shown=full.length;els.txt.textContent=full;
}
function showChoices(b){
  awaiting=true;st.typing=false;
  els.txt.className='txt narr';
  els.txt.textContent=UI[lang].choose;
  els.next.hidden=true;
  els.choices.innerHTML='';
  els.choices.hidden=false;
  b.opts.forEach(function(o,i){
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=(i+1)+'. '+o.t[lang];
    btn.addEventListener('click',function(e){e.stopPropagation();choose(i);});
    els.choices.appendChild(btn);
  });
}
function enter(){
  const it=Q[qi],b=it.b;
  curBeat=b;
  if(it.first){chap=it.ci;setScene(CH[it.ci].scene,CH[it.ci].from);updChip();}
  if(b.cast)applyCast(b.cast);
  st.speaker=b.who||null;
  setWho(b.who||null);
  if(b.choice){showChoices(b);}
  else{
    awaiting=false;
    els.choices.hidden=true;els.next.hidden=false;
    startType(b.t[lang],!b.who);
  }
}
function choose(i){
  if(!awaiting)return;
  const b=Q[qi].b,opt=b.opts[i],ci=Q[qi].ci,ins=[];
  hearts=Math.min(5,hearts+1);drawHud();
  if(opt.say)ins.push({who:'AZZY',t:opt.t});
  opt.after.forEach(function(x){ins.push(x);});
  Q.splice.apply(Q,[qi+1,0].concat(ins.map(function(x){return {b:x,ci:ci,first:false};})));
  awaiting=false;
  goNext();
}
function goNext(){
  qi++;
  if(qi>=Q.length){endGame();return;}
  enter();
}
function advance(){
  if(!playing||awaiting)return;
  if(st.typing){finishType();return;}
  goNext();
}
function build(){
  Q=[];
  CH.forEach(function(c,ci){c.beats.forEach(function(b,bi){Q.push({b:b,ci:ci,first:bi===0});});});
}
function startGame(){
  build();qi=0;hearts=0;playing=true;awaiting=false;
  els.title.hidden=true;els.endcard.hidden=true;
  els.chip.hidden=false;els.hud.hidden=false;
  drawHud();enter();
}
function endGame(){
  playing=false;st.typing=false;
  hearts=5;drawHud();
  els.next.hidden=true;els.choices.hidden=true;els.who.hidden=true;
  els.txt.className='txt narr';els.txt.textContent='';
  els.endcard.hidden=false;
  st.speaker=null;
}
function applyLang(){
  const u=UI[lang];
  document.documentElement.lang=lang;
  els.tagline.textContent=u.tagline;
  els.start.textContent=u.start;
  els.hint.textContent=u.hint;
  els.endTitle.textContent=u.end;
  els.endSub.textContent=u.endSub;
  els.again.textContent=u.again;
  els.mus.textContent=u.music+': '+(musicOn?u.on:u.off);
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false');});
  if(playing){
    updChip();
    if(curBeat&&curBeat.choice&&awaiting){showChoices(curBeat);}
    else if(curBeat&&curBeat.t){full=curBeat.t[lang];finishType();}
  }
}

/* ---------- music ---------- */
let ac=null,musicOn=false,mTimer=null,mStep=0;
const MEL=[523.25,659.25,783.99,659.25, 698.46,880,1046.5,880, 587.33,698.46,880,698.46, 783.99,987.77,1174.66,987.77];
const BAS=[130.81,174.61,146.83,196];
function tone(f,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+dur);
}
function musicTick(){
  tone(MEL[mStep%16],0.3,'square',0.02);
  if(mStep%4===0)tone(BAS[(mStep/4|0)%4],1.0,'triangle',0.05);
  mStep++;
}
function toggleMusic(){
  try{
    if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();}
    if(ac.resume)ac.resume();
    musicOn=!musicOn;
    if(musicOn){mTimer=setInterval(musicTick,300);}else{clearInterval(mTimer);mTimer=null;}
    els.mus.setAttribute('aria-pressed',musicOn?'true':'false');
    applyLang();
  }catch(e){}
}

/* ---------- events ---------- */
document.querySelectorAll('[data-lang]').forEach(function(b){
  b.addEventListener('click',function(){
    lang=b.getAttribute('data-lang');
    try{localStorage.setItem('azzy-keiii-lang',lang);}catch(e){}
    applyLang();
  });
});
els.mus.addEventListener('click',toggleMusic);
els.start.addEventListener('click',function(e){e.stopPropagation();startGame();});
els.again.addEventListener('click',function(e){e.stopPropagation();startGame();});
els.dlg.addEventListener('click',advance);
els.wrap.addEventListener('click',advance);
document.addEventListener('keydown',function(e){
  const tag=(e.target&&e.target.tagName)||'';
  if(e.key==='1'||e.key==='2'){if(awaiting)choose(e.key==='1'?0:1);return;}
  if((e.code==='Space'||e.key===' '||e.key==='Enter')&&tag!=='BUTTON'){e.preventDefault();if(playing)advance();}
});

/* ---------- loop ---------- */
function move(cur,tar,dt){
  const d=tar-cur,s=40*dt;
  return Math.abs(d)<=s?tar:cur+Math.sign(d)*s;
}
let last=0;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  TT+=dt;
  st.azx=move(st.azx,st.azt,dt);
  st.kex=move(st.kex,st.ket,dt);
  if(st.typing){
    const n=reduce?full.length:Math.floor((performance.now()-typeStart)/22);
    if(n!==shown){shown=Math.min(full.length,n);els.txt.textContent=full.slice(0,shown);}
    if(shown>=full.length)st.typing=false;
  }
  const sc=SC[sceneName];
  sc.bg(TT);
  drawCast(sc.g,TT,sc.wed);
  sc.fg(TT);
  if(st.fx==='hearts')fxHearts(TT,sc.g);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(function(){
  const g=els.th.getContext('2d');g.fillStyle='#ff6f91';
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(HM[j][i]==='X')g.fillRect(i,j,1,1);
})();
setScene('park',{az:84,ke:96});
st.fx='hearts';
applyLang();
requestAnimationFrame(function(t){last=t;frame(t);});

})();
</script>

</body></html>
